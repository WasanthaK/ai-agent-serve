name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      OPENAI_API_KEY: test-only-key
      AGENT_INBOUND_API_KEY: inbound-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AGENT_INBOUND_SOURCE: website
      AGENT_OPERATOR_CREDENTIALS: '[{"id":"wasantha","key":"operator-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","permissions":["read","analyze","reply","decide","tools"]},{"id":"viewer","key":"viewer-cccccccccccccccccccccccccccccccccccccccc","permissions":["read"]}]'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run unit test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentdb
          POSTGRES_USER: agentuser
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentuser -d agentdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: agentdb
      POSTGRES_USER: agentuser
      POSTGRES_PASSWORD: integration-only-password
      PGPASSWORD: integration-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Build fresh database from migrations
        run: |
          for migration in migrations/*.sql; do
            psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Reapply migrations to prove idempotency
        run: |
          for migration in migrations/*.sql; do
            psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run PostgreSQL persistence integration test
        run: python tests/integration_database.py -q
