name: Unit tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      OPENAI_API_KEY: test-only-key
      AGENT_INBOUND_API_KEY: inbound-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      AGENT_INBOUND_SOURCE: website
      AGENT_OPERATOR_CREDENTIALS: '[{"id":"wasantha","key":"operator-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","permissions":["read","analyze","reply","decide","tools"]},{"id":"viewer","key":"viewer-cccccccccccccccccccccccccccccccccccccccc","permissions":["read"]}]'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run unit test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
